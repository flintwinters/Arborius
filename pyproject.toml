[project]
name = "arborius-playsite"
version = "0.1.0"
description = "A server-authoritative 3D stacking strategy game"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
